name: Validate pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  local:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: mkdir -p target
      - run: python -m pytest -q --basetemp target/pytest
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: local-validation
          path: target/pytest/**/report.json
          if-no-files-found: ignore
  bigquery-parse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-bigquery.txt
      - run: dbt parse --profiles-dir profiles --target bigquery
        env:
          BQ_PROJECT: portfolio-validation
          BQ_DATASET: motorsports
          BQ_RAW_DATASET: motorsports_raw
          DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
