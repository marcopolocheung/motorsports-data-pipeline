version: 2
sources:
- name: motorsports_raw
  description: Motorsports inputs; synthetic local fixtures or user-owned BigQuery
    tables.
  database: '{{ target.database }}'
  schema: '{{ target.schema ~ ''_raw'' if target.type == ''duckdb'' else env_var(''BQ_RAW_DATASET'',
    ''motorsports_raw'') }}'
  tables:
  - name: circuits
    description: Append-only raw versions of circuits.
    columns:
    - name: Location
      data_type: STRING
    - name: Track_Length_km
      data_type: FLOAT64
    - name: Turns
      data_type: INT64
    - name: Direction
      data_type: STRING
    - name: Circuit_Type
      data_type: STRING
    - name: First_Grand_Prix
      data_type: STRING
    - name: Last_Grand_Prix
      data_type: STRING
    - name: Races
      data_type: INT64
    - name: Best_Lap_Timing
      data_type: STRING
    - name: Best_Lap_Driver
      data_type: STRING
    - name: Best_Lap_Year
      data_type: INT64
    - name: Best_Lap_Time
      data_type: FLOAT64
    - name: high_speed_sector_ratio
      data_type: STRING
    - name: overtaking_difficulty
      data_type: STRING
    - name: track_archetype
      data_type: STRING
    - name: _data_source
      data_type: STRING
    - name: _load_time
      data_type: TIMESTAMP
      description: Ingestion timestamp; updates append a newer version of the same
        source key.
      data_tests:
      - not_null
  - name: constructure
    description: Append-only raw versions of constructure.
    columns:
    - name: constructorId
      data_type: INT64
    - name: constructorRef
      data_type: STRING
    - name: name
      data_type: STRING
    - name: nationality
      data_type: STRING
    - name: url
      data_type: STRING
    - name: _load_time
      data_type: TIMESTAMP
      description: Ingestion timestamp; updates append a newer version of the same
        source key.
      data_tests:
      - not_null
  - name: drivers
    description: Append-only raw versions of drivers.
    columns:
    - name: Driver
      data_type: STRING
    - name: Nationality
      data_type: STRING
    - name: Seasons
      data_type: STRING
    - name: Championships
      data_type: FLOAT64
    - name: Race_Entries
      data_type: FLOAT64
    - name: Race_Starts
      data_type: FLOAT64
    - name: Pole_Positions
      data_type: FLOAT64
    - name: Race_Wins
      data_type: FLOAT64
    - name: Podiums
      data_type: FLOAT64
    - name: Fastest_Laps
      data_type: FLOAT64
    - name: Points
      data_type: FLOAT64
    - name: Active
      data_type: BOOL
    - name: Championship_Years
      data_type: STRING
    - name: Decade
      data_type: INT64
    - name: Pole_Rate
      data_type: FLOAT64
    - name: Start_Rate
      data_type: FLOAT64
    - name: Win_Rate
      data_type: FLOAT64
    - name: Podium_Rate
      data_type: FLOAT64
    - name: FastLap_Rate
      data_type: FLOAT64
    - name: Points_Per_Entry
      data_type: FLOAT64
    - name: Years_Active
      data_type: INT64
    - name: Champion
      data_type: BOOL
    - name: _load_time
      data_type: TIMESTAMP
      description: Ingestion timestamp; updates append a newer version of the same
        source key.
      data_tests:
      - not_null
  - name: driver_seasons
    description: Append-only raw versions of driver_seasons.
    columns:
    - name: Driver
      data_type: STRING
    - name: Season
      data_type: INT64
    - name: _load_time
