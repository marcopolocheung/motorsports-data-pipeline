      data_type: INT64
    - name: year
      data_type: INT64
    - name: round
      data_type: INT64
    - name: circuitId
      data_type: INT64
    - name: name
      data_type: STRING
    - name: date
      data_type: STRING
    - name: time
      data_type: STRING
    - name: url
      data_type: STRING
    - name: fp1_date
      data_type: STRING
    - name: fp1_time
      data_type: STRING
    - name: fp2_date
      data_type: STRING
    - name: fp2_time
      data_type: STRING
    - name: fp3_date
      data_type: STRING
    - name: fp3_time
      data_type: STRING
    - name: quali_date
